<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Image Gallery</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="image-container">
        <span style="--i:1">
            <img src="https://picsum.photos/id/37/300/200" alt="">
        </span>
        <span style="--i:2">
            <img src="https://picsum.photos/id/281/300/200" alt="">
        </span>
        <span style="--i:3">
            <img src="https://picsum.photos/id/757/300/200" alt="">
        </span>
        <span style="--i:4">
            <img src="https://picsum.photos/id/106/300/200" alt="">
        </span>
        <span style="--i:5">
            <img src="https://picsum.photos/id/1057/300/200" alt="">
        </span>
        <span style="--i:6">
            <img src="https://picsum.photos/id/645/300/200" alt="">
        </span>
        <span style="--i:7">
            <img src="https://picsum.photos/id/973/300/200" alt="">
        </span>
        <span style="--i:8">
            <img src="https://picsum.photos/id/517/300/200" alt="">
        </span>
    </div>
    <div class="btn-container">
        <div class="btn" id="prev">Prev</div>
        <div class="btn" id="next">Next</div>
    </div>
    <script src="index.js"></script>
</body>
</html>
